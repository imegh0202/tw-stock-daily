<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F5F7FA">
<title>歷史日報｜台股每日觀察</title>
<meta name="description" content="查詢歷年台股每日盤後日報、加權指數與市場風險紀錄。">
<script src="./assets/theme.js"></script>
<link rel="stylesheet" href="./assets/style.css">
<style>
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel-soft);color:var(--text);font:inherit}
.archive-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:15px 0;border-top:1px solid var(--line);text-decoration:none}
.archive-row:first-child{border-top:0}
.archive-row strong{display:block;font-size:15px}
.archive-row small{display:block;color:var(--muted);font-size:14px;margin-top:3px}
.archive-right{text-align:right;white-space:nowrap;font-size:14px}
.archive-right em{display:block;font-style:normal;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header class="site-header"><div class="container brand"><h1>📊 台股每日觀察</h1><div class="header-actions"><span class="date">歷史日報</span><button type="button" class="theme-switch" data-theme-toggle aria-label="切換深色模式"><span class="theme-icon">☾</span><span class="theme-label">深色</span></button></div></div></header>
<main class="container">
<section class="section">
  <h3>歷史日報</h3>
  <p style="color:var(--muted)">依日期排序保存每日市場紀錄。按下日期即可閱讀完整分析，包含風險事件日曆與情境觀察。</p>
  <input class="search" type="search" id="q" placeholder="搜尋日期或市場狀態，例如 2026-10、風險升高" aria-label="搜尋歷史日報">
  <div id="report-list"><a class="archive-row" href="./reports/2026-10-15.html"><span><strong>2026/10/15 台股日報</strong><small>風險顯著升高</small></span><span class="archive-right">46,969.87<em>-3.41%</em></span></a></div>
</section>
<nav class="navlinks"><a href="./index.html">返回最新日報</a><a href="./guide.html">投資理財知識庫</a></nav>
</main>
<footer class="footer"><div class="container">資料僅供研究與風險教育，不構成投資建議。</div></footer>
<script>
(()=>{const list=document.getElementById('report-list'),q=document.getElementById('q');
let reports=[];
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){const key=q.value.trim().toLowerCase();const rows=reports.filter(r=>(r.date+' '+(r.market_state||'')).toLowerCase().includes(key));
list.innerHTML=rows.length?rows.map(r=>'<a class="archive-row" href="./'+encodeURI(r.url)+'"><span><strong>'+escapeHtml(r.title||r.date)+'</strong><small>'+escapeHtml(r.market_state||'未分類')+'</small></span><span class="archive-right">'+(Number.isFinite(Number(r.taiex_close))&&r.taiex_close!==null?Number(r.taiex_close).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'休市')+'<em>'+(typeof r.change_pct==='number'?(r.change_pct>0?'+':'')+r.change_pct.toFixed(2)+'%':'—')+'</em></span></a>').join(''):'<p>沒有符合條件的紀錄。</p>';}
fetch('./data/history.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('load failed');return r.json()}).then(data=>{reports=data.sort((a,b)=>b.date.localeCompare(a.date));draw()}).catch(()=>{});
q.addEventListener('input',draw);
})();
</script>
</body></html>
